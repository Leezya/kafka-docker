services:
  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka-server
    hostname: kafka
    user: root
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
      # Đổi thành IP ZeroTier của máy cài đặt
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://10.68.71.204:9092
      - KAFKA_HEAP_OPTS=-Xmx1G -Xms1G
    volumes:
      - kafka_data:/bitnami/kafka
    deploy:
      resources:
        limits:
          memory: 1.5G

  # --- Bổ sung thêm phần này ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080" # Bạn có thể đổi cổng 8080 thành cổng khác nếu bị trùng
    environment:
      - KAFKA_CLUSTERS_0_NAME=My-Cluster
      # Điền đúng IP ZeroTier của máy này
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=10.68.71.204:9092
    depends_on:
      - kafka
    deploy:
      resources:
        limits:
          memory: 512M # Ép RAM để không ảnh hưởng đến Spark

volumes:
  kafka_data:
